# Spring Boot Server Configuration
server.port=5000
spring.application.name=campus-ai-backend

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:campusaidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# H2 Console (for dev debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL init
spring.sql.init.mode=always

# JWT Secret - read from environment, no committed default.
app.jwt.secret=${CAMPUS_JWT_SECRET:CampusAI_SuperSecretKey_2026_ChangeThisInProduction_HMAC_SHA256_512bit}
app.jwt.expiration-ms=86400000


# ============================================================
# OAuth2 (Google) - Single Sign-On
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:399397515522-4kg61f78vfsv8j3r6nb7kkb8bbpiacqr.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5000/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Frontend origin the OAuth success handler redirects to
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.frontend-callback-path=/auth/callback
